name: ShellCheck

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Lint and smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        # Severity/exclusions come from .shellcheckrc
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./
          format: gcc

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: Install bats and yq
        run: sudo apt-get update && sudo apt-get install -y bats yq

      - name: Functional tests (bats)
        run: bats tests/
